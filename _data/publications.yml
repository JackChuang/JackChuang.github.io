#    venue_full  (optional)  full proceedings name. Becomes the <abbr> tooltip,
#                            so a reader who does not know the acronym can get
#                            it without the page having to spell it out.
#    kind        (optional)  Conference | Journal | Workshop | Thesis | Preprint
#    pdf         (optional)  direct link to a free full text. If set, the TITLE
#                            links here — one click to the paper, no paywall.
#                            Without it the title falls back to the DOI.
#    links       (optional)  list of { name, url } — the secondary row:
#                            DOI, arXiv, Code, Artifact, Slides, Video
#
#  Template:
