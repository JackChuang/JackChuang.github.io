# ---- build --------------------------------------------------------------
markdown: kramdown
permalink: pretty
sass:
  style: compressed

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Kept out of the built site. "*.md" rather than a list of filenames: every page
# here is .html, so no Markdown is ever content, and naming the local-only notes
# files individually would put their names in a public repo for no reason.
exclude:
  - "*.md"
  - "*.sh"
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
